<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8" />
    <title>Logowanie — Medycyna Rodzinna</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 460px;
            margin: 60px auto;
            padding: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            font-size: 18px;
            text-align: center;
            letter-spacing: 4px;
            margin: 12px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            background: #1a1a1a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: default;
        }

        .msg {
            color: #666;
            font-size: 14px;
            margin-top: 8px;
        }

        .error {
            color: #c0392b;
        }

        a {
            color: #1e5f6e;
        }

        .plans {
            display: flex;
            gap: 12px;
            margin: 20px 0;
        }

        .plan-card {
            flex: 1;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
        }

        .plan-card.selected {
            border-color: #1a1a1a;
        }

        .plan-card h3 {
            margin: 0 0 8px;
            font-size: 16px;
        }

        .plan-card .price {
            font-size: 22px;
            font-weight: bold;
        }

        .plan-card .note {
            font-size: 12px;
            color: #888;
        }

        #payment-element {
            margin: 20px 0;
        }
    </style>
</head>

<body>
    <div id="app"></div>

    <!-- Clerk -->
    <script defer crossorigin="anonymous"
        src="https://tough-walrus-9689.clerk.accounts.dev/npm/@clerk/ui@1/dist/ui.browser.js" type="text/javascript">
        </script>
    <script defer crossorigin="anonymous"
        data-clerk-publishable-key="pk_test_dG91Z2gtd2FscnVzLTk2ODkuY2xlcmsuYWNjb3VudHMuZGV2JA"
        src="https://tough-walrus-9689.clerk.accounts.dev/npm/@clerk/clerk-js@6/dist/clerk.browser.js"
        type="text/javascript">
        </script>

    <!-- EmailJS -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <!-- Stripe -->
    <script src="https://js.stripe.com/v3/"></script>

    <script>
        const EMAILJS_SERVICE_ID = "service_7u6mwah";
        const EMAILJS_TEMPLATE_ID = "template_7x3bvjb";
        const EMAILJS_PUBLIC_KEY = "AeDwjeMU-SWzZoXx5";
        const CHECK_SUBSCRIPTION_URL = "https://checksubscription-zxtlz2nofa-uc.a.run.app";
        const CREATE_SUBSCRIPTION_URL = "https://us-central1-medycyna-rodzinna.cloudfunctions.net/createSubscription";
        const STRIPE_PUBLISHABLE_KEY = "pk_test_51UDnlkRJp5FrnUgdWUfF4gSH3xM2D8a32HBQa9H9M2wRDKiwguevuo34ebWz8SpOe60T0PqWEjNyE2zflhWvzzNl00GH1UODSL";
        const PLANS = {
            monthly: { priceId: "price_1UDnz1RJp5FrnUgdIXbyfJwl", label: "Miesięczny", price: "35 zł / mies." },
            annual: { priceId: "price_1UDo23RJp5FrnUgdYcLSFMjh", label: "Roczny", price: "315 zł / rok", note: "oszczędzasz 25%" },
        };

        const stripeJs = Stripe(STRIPE_PUBLISHABLE_KEY);
        let elements = null;
        let selectedPlanKey = "monthly";

        emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });

        let generatedCode = null;

        function generateCode() {
            return Math.floor(1000 + Math.random() * 9000).toString(); // 4 cyfry
        }

        function renderCodeForm(email) {
            document.getElementById('app').innerHTML = `
                <h2>Sprawdź skrzynkę pocztową</h2>
                <p>Wysłaliśmy 4-cyfrowy kod na adres: <strong>${email}</strong></p>
                <input type="text" id="codeInput" maxlength="4" placeholder="0000" inputmode="numeric" />
                <button id="verifyBtn">Zweryfikuj</button>
                <p class="msg" id="statusMsg"></p>
            `;
            document.getElementById('verifyBtn').addEventListener('click', () => {
                const entered = document.getElementById('codeInput').value.trim();
                const statusMsg = document.getElementById('statusMsg');
                if (entered === generatedCode) {
                    sessionStorage.setItem('emailVerified', 'true');
                    showProtectedContent();
                } else {
                    statusMsg.textContent = "Nieprawidłowy kod, spróbuj ponownie.";
                    statusMsg.className = "msg error";
                }
            });
        }

        async function sendVerificationEmail(email) {
            generatedCode = generateCode();
            const expiresAt = new Date(Date.now() + 10 * 60000).toLocaleTimeString('pl-PL');

            try {
                await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
                    passcode: generatedCode,
                    time: expiresAt,
                    email: email,
                });
                renderCodeForm(email);
            } catch (err) {
                document.getElementById('app').innerHTML = `<p class="error">Błąd wysyłki e-maila: ${err.text || err}</p>`;
            }
        }

        async function showProtectedContent() {
            document.getElementById('app').innerHTML = `
                <h2>Witaj! 🎉</h2>
                <p id="subStatus">Sprawdzam status subskrypcji…</p>
                <div id="user-button"></div>
                <div id="subscriptionArea"></div>
                <p><a href="/">Wróć do strony głównej</a></p>
            `;
            Clerk.mountUserButton(document.getElementById('user-button'));

            // Powrót z przekierowania płatności (np. BLIK) — Stripe dokłada te parametry do URL
            const params = new URLSearchParams(window.location.search);
            const redirectStatus = params.get('redirect_status');
            if (redirectStatus) {
                window.history.replaceState({}, document.title, window.location.pathname);
                if (redirectStatus === 'succeeded' || redirectStatus === 'processing') {
                    document.getElementById('subscriptionArea').innerHTML =
                        `<p class="msg">Płatność ${redirectStatus === 'succeeded' ? 'zakończona sukcesem' : 'jest przetwarzana'} — sprawdzam dostęp…</p>`;
                } else {
                    document.getElementById('subscriptionArea').innerHTML =
                        `<p class="msg error">Płatność nie powiodła się (${redirectStatus}). Spróbuj ponownie.</p>`;
                }
            }

            await refreshSubscriptionStatus();
        }

        async function refreshSubscriptionStatus() {
            const subStatus = document.getElementById('subStatus');
            try {
                const token = await Clerk.session.getToken();
                const response = await fetch(CHECK_SUBSCRIPTION_URL, {
                    headers: { Authorization: `Bearer ${token}` },
                });
                const data = await response.json();

                if (data.subscriptionActive) {
                    subStatus.textContent = "Twoja subskrypcja jest aktywna — treści premium odblokują się automatycznie.";
                    document.getElementById('subscriptionArea').innerHTML = '';
                } else {
                    subStatus.textContent = "Nie masz jeszcze aktywnej subskrypcji.";
                    renderPlanPicker();
                }
            } catch (err) {
                subStatus.textContent = "Nie udało się sprawdzić statusu subskrypcji.";
            }
        }

        function renderPlanPicker() {
            const area = document.getElementById('subscriptionArea');
            area.innerHTML = `
                <div class="plans">
                    ${Object.entries(PLANS).map(([key, plan]) => `
                        <div class="plan-card ${key === selectedPlanKey ? 'selected' : ''}" data-plan="${key}">
                            <h3>${plan.label}</h3>
                            <div class="price">${plan.price}</div>
                            ${plan.note ? `<div class="note">${plan.note}</div>` : ''}
                        </div>
                    `).join('')}
                </div>
                <button id="startPaymentBtn">Wybierz plan i zapłać</button>
                <p class="msg" id="paymentMsg"></p>
                <div id="payment-element"></div>
                <button id="confirmPaymentBtn" style="display:none;">Zapłać</button>
            `;

            area.querySelectorAll('.plan-card').forEach((card) => {
                card.addEventListener('click', () => {
                    selectedPlanKey = card.dataset.plan;
                    area.querySelectorAll('.plan-card').forEach((c) => c.classList.remove('selected'));
                    card.classList.add('selected');
                });
            });

            document.getElementById('startPaymentBtn').addEventListener('click', startPayment);
        }

        async function startPayment() {
            const paymentMsg = document.getElementById('paymentMsg');
            const startBtn = document.getElementById('startPaymentBtn');
            startBtn.disabled = true;
            paymentMsg.textContent = "Przygotowuję płatność…";
            paymentMsg.className = "msg";

            try {
                const token = await Clerk.session.getToken();
                const email = Clerk.user.primaryEmailAddress.emailAddress;
                const response = await fetch(CREATE_SUBSCRIPTION_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        Authorization: `Bearer ${token}`,
                    },
                    body: JSON.stringify({ priceId: PLANS[selectedPlanKey].priceId, email }),
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.error || `Błąd serwera (${response.status})`);
                }

                const { clientSecret } = await response.json();

                elements = stripeJs.elements({ clientSecret, locale: 'pl' });
                const paymentElement = elements.create('payment');
                paymentElement.mount('#payment-element');

                startBtn.style.display = 'none';
                document.getElementById('confirmPaymentBtn').style.display = 'block';
                document.getElementById('confirmPaymentBtn').addEventListener('click', confirmPayment);
                paymentMsg.textContent = "";
            } catch (err) {
                paymentMsg.textContent = `Błąd: ${err.message}`;
                paymentMsg.className = "msg error";
                startBtn.disabled = false;
            }
        }

        async function confirmPayment() {
            const paymentMsg = document.getElementById('paymentMsg');
            const confirmBtn = document.getElementById('confirmPaymentBtn');
            confirmBtn.disabled = true;
            paymentMsg.textContent = "Przetwarzam płatność…";
            paymentMsg.className = "msg";

            const { error } = await stripeJs.confirmPayment({
                elements,
                confirmParams: {
                    return_url: window.location.origin + window.location.pathname,
                },
            });

            // Jeśli metoda płatności nie wymaga przekierowania (np. karta bez 3DS),
            // dotrzemy tutaj tylko w przypadku błędu — sukces przenosi na return_url.
            if (error) {
                paymentMsg.textContent = `Błąd płatności: ${error.message}`;
                paymentMsg.className = "msg error";
                confirmBtn.disabled = false;
            }
        }

        window.addEventListener('load', async function () {
            const { plPL } = await import('https://esm.sh/@clerk/localizations');

            await Clerk.load({
                ui: { ClerkUI: window.__internal_ClerkUICtor },
                localization: plPL,
            });

            if (Clerk.isSignedIn) {
                const email = Clerk.user.primaryEmailAddress.emailAddress;
                if (sessionStorage.getItem('emailVerified') === 'true') {
                    showProtectedContent();
                } else {
                    document.getElementById('app').innerHTML = `<p>Wysyłanie kodu weryfikacyjnego...</p>`;
                    await sendVerificationEmail(email);
                }
            } else {
                sessionStorage.removeItem('emailVerified');
                document.getElementById('app').innerHTML = `<div id="sign-in"></div>`;
                Clerk.mountSignIn(document.getElementById('sign-in'));
            }
        });
    </script>
</body>

</html>
